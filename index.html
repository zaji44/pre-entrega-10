<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador con Async/Await y Librerías</title>
    
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            background-color: #f4f6f8;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .loader {
            text-align: center;
            font-size: 1.2rem;
            color: #007bff;
            font-weight: bold;
            margin: 20px 0;
        }
        .grid-productos {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .card {
            background-color: #fff;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            text-align: center;
        }
        .card h3 {
            margin-top: 0;
            color: #222;
        }
        .card p {
            margin: 8px 0;
            color: #666;
        }
        .card .precio {
            font-size: 1.2rem;
            font-weight: bold;
            color: #28a745;
        }
        .btn-comprar {
            background-color: #007bff;
            color: #fff;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
            width: 100%;
        }
        .btn-comprar:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <h1>Catálogo de Productos</h1>

    
    <div id="loader" class="loader">⏳ Cargando productos...</div>

    
    <div id="contenedor-productos" class="grid-productos"></div>

    
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <script src="./js/main.js"></script>
</body>
</html>
